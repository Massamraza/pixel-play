<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Play - Comments Section</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="PP.jpg" type="Image">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 16px 12px 160px 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Comments Header */
        .comments-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .comments-header svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .header-icon-flipped {
            transform: scaleX(-1);
        }

        /* Comments List Container */
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .comment-thread {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            width: 100%;
        }

        /* Right-Indented Replies Container */
        .replies-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            padding-left: 48px;
            margin-top: 8px;
        }
        .replies-container.active {
            display: flex;
        }

        .reply-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            width: 100%;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #222;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid #333;
        }

        .reply-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #222;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid #333;
        }

        .user-avatar img, .reply-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-body {
            flex: 1;
            min-width: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .user-name-text {
            font-weight: 700;
            font-size: 13.5px;
            color: #fff;
        }

        /* Blue Verified Badge */
        .verified-badge {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            vertical-align: middle;
        }

        .verified-badge svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .comment-time {
            color: #666666;
            font-size: 10px;
        }

        .comment-text {
            color: #cccccc;
            font-size: 12.5px;
            line-height: 1.45;
            margin-bottom: 8px;
            word-break: break-word;
        }

        /* Comment Actions */
        .comment-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 11px;
            color: #888888;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
            background: none;
            border: none;
            color: #888888;
            font-size: 11px;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: #ffffff;
        }

        .action-btn svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .action-btn.liked {
            color: #ff0000;
        }
        .action-btn.liked svg {
            fill: #ff0000;
            stroke: #ff0000;
        }

        .delete-btn {
            color: #ff4444;
        }
        .delete-btn:hover {
            color: #ff0000;
        }

        /* Arrow Icon Animation */
        .arrow-icon {
            transition: transform 0.2s ease;
            width: 12px;
            height: 12px;
        }

        .arrow-down {
            transform: rotate(180deg);
        }

        .no-comments {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 50px;
        }

        /* Bottom Fixed Input Card */
        .bottom-comment-card {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 476px;
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 14px;
            padding: 8px 10px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.9);
            z-index: 100;
        }

        /* Replying Banner Preview */
        .replying-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: #1f1f1f;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #aaa;
            border-left: 3px solid #ff0000;
        }

        .replying-banner.active {
            display: flex;
        }

        .replying-banner b {
            color: #fff;
        }

        .cancel-reply-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .cancel-reply-btn:hover {
            color: #fff;
        }

        .card-user-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #222;
            overflow: hidden;
        }

        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-username {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        /* Emoji Picker Bar */
        .emoji-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 2px 2px 8px 2px;
            width: 100%;
        }

        .emoji-bar.active {
            display: flex;
        }

        .emoji-item {
            font-size: 18px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .emoji-item:hover {
            transform: scale(1.25);
        }

        /* Input Wrapper */
        .input-wrapper {
            background-color: #242424;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 4px 4px 4px 14px;
            width: 100%;
        }

        .comment-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13px;
        }

        .comment-input::placeholder {
            color: #777777;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .emoji-toggle-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            color: #888888;
        }

        .emoji-toggle-btn:hover,
        .emoji-toggle-btn.active {
            color: #ffffff;
        }

        .emoji-toggle-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .send-btn {
            background-color: #ff0000;
            border: none;
            border-radius: 20px;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #cc0000;
        }

        .send-btn svg {
            width: 15px;
            height: 15px;
            fill: #ffffff;
        }

        /* Custom Modal Popups */
        .auth-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-modal-overlay.active {
            display: flex;
        }

        .auth-modal-card {
            background: #161616;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            max-width: 320px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .auth-modal-card h3 {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .auth-modal-card p {
            color: #bbb;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .auth-modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .auth-modal-btns button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            flex: 1;
        }

        .btn-login-red {
            background: #ff0000;
            color: #fff;
        }

        .btn-cancel-dark {
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="comments-header">
        <svg class="header-icon-flipped" viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
        <span id="commentCountTitle">0 Comments</span>
        <svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
    </div>

    <!-- Comments List -->
    <div class="comments-list" id="commentsList">
        <div class="no-comments">Loading comments...</div>
    </div>

    <!-- Bottom Input Section -->
    <div class="bottom-comment-card">
        <!-- Replying Banner -->
        <div class="replying-banner" id="replyingBanner">
            <span>Replying to <b id="replyingToName"></b></span>
            <button class="cancel-reply-btn" onclick="cancelReply()">✕</button>
        </div>

        <div class="card-user-header">
            <div class="card-avatar">
                <img id="currentLoginUserImg" src="blank.jpg" alt="DP" onerror="this.src='blank.jpg';">
            </div>
            <span class="card-username" id="currentLoginUserName">Guest User</span>
        </div>

        <div class="emoji-bar" id="emojiBar">
            <span class="emoji-item" onclick="insertEmoji('😂')">😂</span>
            <span class="emoji-item" onclick="insertEmoji('🤩')">🤩</span>
            <span class="emoji-item" onclick="insertEmoji('🥰')">🥰</span>
            <span class="emoji-item" onclick="insertEmoji('🤤')">🤤</span>
            <span class="emoji-item" onclick="insertEmoji('😱')">😱</span>
            <span class="emoji-item" onclick="insertEmoji('😭')">😭</span>
            <span class="emoji-item" onclick="insertEmoji('😤')">😤</span>
            <span class="emoji-item" onclick="insertEmoji('😡')">😡</span>
            <span class="emoji-item" onclick="insertEmoji('🥵')">🥵</span>
        </div>

        <div class="input-wrapper">
            <input type="text" id="commentInput" class="comment-input" placeholder="Add Comment" autocomplete="off" onclick="checkAuthBeforeInput()">
            <div class="input-actions">
                <button type="button" class="emoji-toggle-btn" id="emojiToggleBtn" onclick="toggleEmojiPanel()">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="9" cy="10" r="1.25"/><circle cx="15" cy="10" r="1.25"/>
                        <path d="M8 14.5c1.2 1.5 2.8 2 4 2s2.8-.5 4-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button type="button" class="send-btn" onclick="postComment()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Login Required Modal Popup -->
    <div id="authAlertModal" class="auth-modal-overlay">
        <div class="auth-modal-card">
            <h3>Authentication Required</h3>
            <p>Please login first to comment, like, or interact with comments.</p>
            <div class="auth-modal-btns">
                <button class="btn-login-red" onclick="window.location.href='login.html'">Login</button>
                <button class="btn-cancel-dark" onclick="closeAuthModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal Popup -->
    <div id="deleteConfirmModal" class="auth-modal-overlay">
        <div class="auth-modal-card">
            <h3>Delete Comment</h3>
            <p id="deleteModalText">Are you sure you want to delete this comment and all its replies?</p>
            <div class="auth-modal-btns">
                <button class="btn-login-red" id="confirmDeleteBtn">Delete</button>
                <button class="btn-cancel-dark" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA7vBJKtJ0iY61y-3iqCvKByIThAzYOF0o",
            authDomain: "pixelplay-8ac18.firebaseapp.com",
            projectId: "pixelplay-8ac18",
            storageBucket: "pixelplay-8ac18.firebasestorage.app",
            messagingSenderId: "965382522854",
            appId: "1:965382522854:web:914d76200b0798d6d1f827",
            measurementId: "G-NSGMLJ94G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const animeSlug = new URLSearchParams(window.location.search).get('anime') || 'global-comments';

        // Accounts that should display the blue verified badge
        const VERIFIED_EMAILS = [
            "massamrazam@gmail.com"
        ];

        function isVerifiedUser(email) {
            return VERIFIED_EMAILS.includes(
                (email || "").trim().toLowerCase()
            );
        }

        function verifiedBadgeHTML(verified) {
            if (!verified) return "";

            return `
                <span class="verified-badge" title="Verified account" aria-label="Verified account">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="11" fill="#2498f5"/>
                        <path d="M7.5 12 L10.5 15 L16.5 9"
                            fill="none"
                            stroke="#fff"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>
                    </svg>
                </span>
            `;
        }
        const commentsListElem = document.getElementById('commentsList');
        const commentCountTitle = document.getElementById('commentCountTitle');
        const currentLoginUserName = document.getElementById('currentLoginUserName');
        const currentLoginUserImg = document.getElementById('currentLoginUserImg');
        const commentInput = document.getElementById('commentInput');
        const replyingBanner = document.getElementById('replyingBanner');
        const replyingToName = document.getElementById('replyingToName');

        let currentUser = null;
        let currentUserPhoto = 'blank.jpg';
        let replyingToCommentId = null;
        let commentIdToDelete = null;
        let replyIdToDelete = null;
        let deleteTargetType = 'comment'; // 'comment' or 'reply'

        loadComments();

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                currentLoginUserName.textContent = user.displayName || user.email.split('@')[0];
                try {
                    const userRef = doc(db, "users", user.uid);
                    const snap = await getDoc(userRef);
                    if (snap.exists() && snap.data().photoURL) {
                        currentUserPhoto = snap.data().photoURL;
                    } else if (user.photoURL) {
                        currentUserPhoto = user.photoURL.replace(/=s96-c/, '=s400-c');
                    }
                } catch (e) {
                    currentUserPhoto = user.photoURL || 'blank.jpg';
                }
                currentLoginUserImg.src = currentUserPhoto;
            } else {
                currentLoginUserName.textContent = "Guest User (Login Required)";
                currentLoginUserImg.src = "blank.jpg";
            }
            loadComments();
        });

        window.checkAuthBeforeInput = function() {
            if (!currentUser) {
                commentInput.blur();
                document.getElementById('authAlertModal').classList.add('active');
            }
        };

        window.closeAuthModal = function() {
            document.getElementById('authAlertModal').classList.remove('active');
        };

        window.closeDeleteModal = function() {
            document.getElementById('deleteConfirmModal').classList.remove('active');
            commentIdToDelete = null;
            replyIdToDelete = null;
        };

        // Load Comments from Firestore
        async function loadComments() {
            try {
                const docRef = doc(db, "animeComments", animeSlug);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().comments) {
                    const comments = docSnap.data().comments;
                    commentCountTitle.textContent = `${comments.length} Comments`;
                    
                    if (comments.length === 0) {
                        commentsListElem.innerHTML = `<div class="no-comments">No comments yet. Be the first to comment!</div>`;
                        return;
                    }

                    commentsListElem.innerHTML = '';
                    comments.forEach((c) => {
                        const isMyComment = currentUser && c.uid === currentUser.uid;
                        const likedByMe = currentUser && c.likes && c.likes.includes(currentUser.uid);
                        const likeCount = c.likes ? c.likes.length : 0;
                        const replies = c.replies || [];
                        const replyCount = replies.length;

                        let repliesHtml = '';
                        if (replyCount > 0) {
                            replies.forEach(r => {
                                const isMyReply = currentUser && r.uid === currentUser.uid;
                                repliesHtml += `
                                    <div class="reply-item">
                                        <div class="reply-avatar">
                                            <img src="${r.photoURL || 'blank.jpg'}" alt="DP" onerror="this.src='blank.jpg';">
                                        </div>
                                        <div class="comment-body">
                                            <div class="user-info">
                                                <span class="user-name-text">${r.userName}</span>
                                                ${verifiedBadgeHTML(r.verified)}
                                                <span class="comment-time">${formatTime(r.timestamp)}</span>
                                            </div>
                                            <div class="comment-text">${escapeHtml(r.text)}</div>
                                            <div class="comment-actions">
                                                ${isMyReply ? `<button class="action-btn delete-btn" onclick="promptDeleteReply('${c.id}', '${r.id}')">Delete</button>` : ''}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            });
                        }

                        const html = `
                            <div class="comment-thread">
                                <div class="comment-item">
                                    <div class="user-avatar">
                                        <img src="${c.photoURL || 'blank.jpg'}" alt="DP" onerror="this.src='blank.jpg';">
                                    </div>
                                    <div class="comment-body">
                                        <div class="user-info">
                                            <span class="user-name-text">${c.userName}</span>
                                            ${verifiedBadgeHTML(c.verified)}
                                            <span class="comment-time">${formatTime(c.timestamp)}</span>
                                        </div>
                                        <div class="comment-text">${escapeHtml(c.text)}</div>
                                        <div class="comment-actions">
                                            <button class="action-btn ${likedByMe ? 'liked' : ''}" onclick="toggleLike('${c.id}')">
                                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                                <span>${likeCount} Likes</span>
                                            </button>
                                            
                                            ${replyCount > 0 ? `
                                                <button class="action-btn" onclick="toggleReplies('${c.id}', this)">
                                                    <span>${replyCount} ${replyCount === 1 ? 'Reply' : 'Replies'}</span>
                                                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z" fill="currentColor"/></svg>
                                                </button>
                                            ` : ''}

                                            ${isMyComment ? 
                                                `<button class="action-btn delete-btn" onclick="promptDeleteComment('${c.id}')">Delete</button>` :
                                                `<button class="action-btn" onclick="prepareReply('${c.id}', '${c.userName}')">Reply</button>`
                                            }
                                        </div>
                                    </div>
                                </div>
                                ${replyCount > 0 ? `
                                    <div class="replies-container" id="replies_${c.id}">
                                        ${repliesHtml}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                        commentsListElem.innerHTML += html;
                    });
                } else {
                    commentCountTitle.textContent = `0 Comments`;
                    commentsListElem.innerHTML = `<div class="no-comments">No comments yet. Be the first to comment!</div>`;
                }
            } catch (err) {
                console.error("Error loading comments:", err);
                commentCountTitle.textContent = `0 Comments`;
                commentsListElem.innerHTML = `<div class="no-comments">No comments yet. Be the first to comment!</div>`;
            }
        }

        window.toggleReplies = function(commentId, btn) {
            const container = document.getElementById(`replies_${commentId}`);
            const arrow = btn.querySelector('.arrow-icon');
            if (container) container.classList.toggle('active');
            if (arrow) arrow.classList.toggle('arrow-down');
        };

        window.prepareReply = function(commentId, userName) {
            if (!currentUser) {
                document.getElementById('authAlertModal').classList.add('active');
                return;
            }
            replyingToCommentId = commentId;
            replyingToName.textContent = userName;
            replyingBanner.classList.add('active');
            commentInput.value = `@${userName} `;
            commentInput.focus();
        };

        window.cancelReply = function() {
            replyingToCommentId = null;
            replyingBanner.classList.remove('active');
            commentInput.value = '';
        };

        window.postComment = async function() {
            if (!currentUser) {
                document.getElementById('authAlertModal').classList.add('active');
                return;
            }

            const text = commentInput.value.trim();
            if (!text) return;

            try {
                const docRef = doc(db, "animeComments", animeSlug);
                const docSnap = await getDoc(docRef);
                let comments = docSnap.exists() ? (docSnap.data().comments || []) : [];

                if (replyingToCommentId) {
                    comments = comments.map(c => {
                        if (c.id === replyingToCommentId) {
                            if (!c.replies) c.replies = [];
                            c.replies.push({
                                id: 'r_' + Date.now() + Math.random().toString(36).substring(2, 9),
                                uid: currentUser.uid,
                                userName: currentUser.displayName || currentUser.email.split('@')[0],
                                photoURL: currentUserPhoto,
                                verified: isVerifiedUser(currentUser.email),
                                text: text,
                                timestamp: Date.now()
                            });
                        }
                        return c;
                    });
                    cancelReply();
                } else {
                    const newComment = {
                        id: 'c_' + Date.now() + Math.random().toString(36).substring(2, 9),
                        uid: currentUser.uid,
                        userName: currentUser.displayName || currentUser.email.split('@')[0],
                        photoURL: currentUserPhoto,
                        verified: isVerifiedUser(currentUser.email),
                        text: text,
                        timestamp: Date.now(),
                        likes: [],
                        replies: []
                    };
                    comments.unshift(newComment);
                    commentInput.value = '';
                }

                await setDoc(docRef, { comments: comments }, { merge: false });
                document.getElementById('emojiBar').classList.remove('active');
                loadComments();
            } catch (err) {
                console.error("Error posting:", err);
                alert("Failed to post comment.");
            }
        };

        window.toggleLike = async function(commentId) {
            if (!currentUser) {
                document.getElementById('authAlertModal').classList.add('active');
                return;
            }

            try {
                const docRef = doc(db, "animeComments", animeSlug);
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) return;

                let comments = docSnap.data().comments || [];
                comments = comments.map(c => {
                    if (c.id === commentId) {
                        if (!c.likes) c.likes = [];
                        if (c.likes.includes(currentUser.uid)) {
                            c.likes = c.likes.filter(id => id !== currentUser.uid);
                        } else {
                            c.likes.push(currentUser.uid);
                        }
                    }
                    return c;
                });

                await setDoc(docRef, { comments: comments }, { merge: false });
                loadComments();
            } catch (err) {
                console.error("Error liking comment:", err);
            }
        };

        window.promptDeleteComment = function(commentId) {
            if (!currentUser) return;
            commentIdToDelete = commentId;
            replyIdToDelete = null;
            deleteTargetType = 'comment';
            document.getElementById('deleteModalText').textContent = "Are you sure you want to delete this comment and all its replies?";
            document.getElementById('deleteConfirmModal').classList.add('active');
        };

        window.promptDeleteReply = function(commentId, replyId) {
            if (!currentUser) return;
            commentIdToDelete = commentId;
            replyIdToDelete = replyId;
            deleteTargetType = 'reply';
            document.getElementById('deleteModalText').textContent = "Are you sure you want to delete this reply?";
            document.getElementById('deleteConfirmModal').classList.add('active');
        };

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!currentUser) return;

            try {
                const docRef = doc(db, "animeComments", animeSlug);
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) return;

                let comments = docSnap.data().comments || [];

                if (deleteTargetType === 'comment' && commentIdToDelete) {
                    comments = comments.filter(c => c.id !== commentIdToDelete);
                } else if (deleteTargetType === 'reply' && commentIdToDelete && replyIdToDelete) {
                    comments = comments.map(c => {
                        if (c.id === commentIdToDelete && c.replies) {
                            c.replies = c.replies.filter(r => r.id !== replyIdToDelete);
                        }
                        return c;
                    });
                }

                await setDoc(docRef, { comments: comments }, { merge: false });
                closeDeleteModal();
                loadComments();
            } catch (err) {
                console.error("Error deleting:", err);
                alert("Failed to delete.");
            }
        });

        window.toggleEmojiPanel = function() {
            document.getElementById('emojiBar').classList.toggle('active');
            document.getElementById('emojiToggleBtn').classList.toggle('active');
        };

        window.insertEmoji = function(emoji) {
            commentInput.value += emoji;
            commentInput.focus();
        };

        function formatTime(ts) {
            const diff = Math.floor((Date.now() - ts) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
            return `${Math.floor(diff/86400)}d ago`;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
